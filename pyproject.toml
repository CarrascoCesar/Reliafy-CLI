[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "reliafy"
version = "0.3.0"
description = "Reliafy is now Brinkpy. Install it with: pip install brinkpy"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{name = "Cesar Carrasco"}]
requires-python = ">=3.10"
# This final release only points users to Brinkpy, so it needs nothing else.
dependencies = []
classifiers = [
  "Development Status :: 7 - Inactive",
]

[project.scripts]
reliafy = "reliafy.moved:main"

[project.urls]
Homepage = "https://brinkpy.app"
Documentation = "https://brinkpy.app"
Repository = "https://github.com/BrinkPy/brinkpy-cli"
"Brinkpy on PyPI" = "https://pypi.org/project/brinkpy/"

# Ship only the notice. The earlier Reliafy code stays in the repository history.
[tool.hatch.build.targets.wheel]
only-include = [
  "reliafy/__init__.py",
  "reliafy/__main__.py",
  "reliafy/moved.py",
]

[tool.hatch.build.targets.sdist]
only-include = [
  "reliafy/__init__.py",
  "reliafy/__main__.py",
  "reliafy/moved.py",
  "README.md",
  "pyproject.toml",
]
